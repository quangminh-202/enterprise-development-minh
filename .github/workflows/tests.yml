name: Run Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          # Health check to ensure MongoDB is fully started
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PolyclinicLab/PolyclinicLab.sln

      - name: Build solution
        run: dotnet build PolyclinicLab/PolyclinicLab.sln --no-restore -c Release

      # Wait until MongoDB is actually accepting connections on port 27017
      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            nc -z localhost 27017 && echo "MongoDB is up" && exit 0
            echo "Waiting for MongoDB..."
            sleep 2
          done
          echo "MongoDB not ready in time" >&2
          exit 1

      # Run the unit tests and generate a TRX report for diagnostics
      - name: Run tests (with detailed logging)
        env:
          # Matches .NET configuration key: ConnectionStrings:polyclinic
          ConnectionStrings__polyclinic: mongodb://localhost:27017
          # Optional: specify a separate database for testing
          Mongo__Database: polyclinic_test
        run: |
          dotnet test PolyclinicLab/PolyclinicLab.sln \
            --no-build -c Release \
            --logger "trx;LogFileName=test_results.trx" \
            --logger "console;verbosity=detailed"

      # Always upload test results, even if tests fail, for easier debugging
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
